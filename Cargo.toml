[package]
name = "house-mcp"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "MCP server for a spatial model of a house and its grounds, kept in PostGIS"
repository = "https://github.com/jeremyandrews/house-mcp"
publish = false

[dependencies]
axum = { version = "0.8.9", features = ["multipart"] }
base64 = "0.23.1"
chrono = { version = "0.4.45", default-features = false, features = ["serde"] }
dxf = "0.6.2"
geozero = { version = "0.15.1", default-features = false, features = ["with-wkb", "with-geojson"] }
hex = "0.4.3"
resvg = { version = "0.48.1", default-features = false, features = ["text"] }
rmcp = { version = "3.5.1", default-features = false, features = ["server", "macros", "schemars", "transport-streamable-http-server"] }
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
skrifa = { version = "0.44.0", default-features = false, features = ["std"] }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "macros", "migrate", "json", "chrono"] }
subtle = "2.6.1"
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread", "net", "fs", "signal"] }
tokio-util = { version = "0.7.20", features = ["io"] }
tower = { version = "0.5.3", default-features = false, features = ["util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["json", "multipart"] }
rmcp = { version = "3.5.1", default-features = false, features = ["client", "transport-streamable-http-client-reqwest"] }
tempfile = "3"
